name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  # Reconstruye cada lunes a las 6:00 UTC para recoger la última aws-base:latest
  # y la última versión del CLI de Infisical sin necesidad de commits.
  schedule:
    - cron: "0 6 * * 1"
  # Permite reconstruir manualmente desde la pestaña Actions.
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          echo "Building image for user: ${{ secrets.DOCKERHUB_USERNAME }}"
          docker build --pull --no-cache -t "${{ secrets.DOCKERHUB_USERNAME }}/ci-infisical-aws:latest" .

      - name: Push Docker image
        run: |
          echo "Pushing image to Docker Hub..."
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/ci-infisical-aws:latest"
